<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Dream Desktop (unofficial)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23cfbcff' d='M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z'/%3E%3C/svg%3E">
<style>
  /* Visual language sampled from the Local Dream app (Material 3 dark, lavender primary) */
  :root {
    --bg: #141218; --card: #1d1b20; --card-hi: #211f26; --line: #938f99; --line-soft: #49454f;
    --on: #e6e0e9; --on-soft: #cac4d0; --primary: #cfbcff; --on-primary: #381e72; --primary-dim: #4f378b;
    --chip: #2b2930; --err-bg: #601410; --err-on: #f9dedc; --gold: #f4c95d; --ok: #7dd3a8;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--on); font: 15px/1.5 Roboto, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg { width: 22px; height: 22px; fill: currentColor; flex: none; }

  header { max-width: 1320px; margin: auto; padding: 22px 32px 6px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .titles { flex: 1; min-width: 280px; }
  .brand { color: var(--on-soft); font-size: 14px; letter-spacing: .4px; display: flex; align-items: center; gap: 6px; }
  .brand .spark { color: var(--gold); }
  h1 { font-size: 40px; font-weight: 400; margin: 6px 0 0; line-height: 1.15; }
  .sub { color: var(--on-soft); font-size: 17px; margin-top: 2px; }
  .status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; color: var(--on-soft); font-size: 13.5px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; font-weight: 500; letter-spacing: .3px; border: 0; }
  .pill.npu { color: var(--primary); border: 1px solid var(--primary-dim); background: transparent; }
  .pill.gone { color: var(--on-soft); border: 1px dashed var(--line-soft); background: transparent; }
  .pill.off { background: var(--err-bg); color: var(--err-on); cursor: pointer; font-size: 13px; }
  .txtbtn { background: none; border: 0; color: var(--primary); cursor: pointer; padding: 4px 8px; border-radius: 16px; font-size: 13.5px; font-weight: 500; }
  .txtbtn:hover { background: rgba(207,188,255,.08); }
  .lang { display: flex; align-items: center; gap: 4px; color: var(--on-soft); padding: 6px 10px; border-radius: 20px; border: 1px solid var(--line-soft); }
  .lang select { background: transparent; border: 0; color: var(--on); cursor: pointer; outline: 0; }
  .lang select option { background: var(--card); }

  main { max-width: 1320px; margin: auto; padding: 18px 32px 48px; display: grid; grid-template-columns: minmax(330px, 440px) 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 14px 16px 40px; } header { padding: 18px 16px 4px; } h1 { font-size: 32px; } }

  .card { background: var(--card); border-radius: 28px; padding: 24px; }
  .field { position: relative; border: 1px solid var(--line); border-radius: 16px; margin: 6px 0 0; padding: 0; }
  .field:focus-within { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .field legend { margin-left: 14px; padding: 0 6px; font-size: 12.5px; color: var(--on-soft); letter-spacing: .3px; }
  .field textarea { display: block; width: 100%; background: transparent; border: 0; outline: 0; resize: vertical; padding: 4px 18px 14px; font-size: 16px; min-height: 96px; line-height: 1.5; }
  .lbl { color: var(--on-soft); font-size: 13px; letter-spacing: .3px; margin: 20px 0 8px; display: flex; align-items: center; gap: 4px; }
  .lbl .grow { flex: 1; }
  .lbl b { color: var(--primary); font-weight: 500; }
  .tip { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-soft); background: transparent; color: var(--on-soft); font-size: 12px; line-height: 1; cursor: pointer; padding: 0; flex: none; }
  .tip:hover, .tip[aria-expanded="true"] { color: var(--on-primary); background: var(--primary); border-color: var(--primary); }
  .tipbox { background: var(--chip); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--on); margin: 0 0 8px; line-height: 1.45; }
  select.model { width: 100%; background: var(--card-hi); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; font-size: 16px; color: var(--on); cursor: pointer; }
  select.model:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  select.model option, select.model optgroup { background: var(--card); }
  .memrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--on-soft); margin-top: 6px; }
  .memrow.low #memory { color: #ffb4ab; }
  .mdesc { color: var(--on-soft); font-size: 12.5px; margin-top: 6px; }
  .seg { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .seg button { background: transparent; border: 1px solid var(--line); color: var(--on); border-radius: 12px; padding: 8px 4px; cursor: pointer; font-size: 13.5px; }
  .seg button[aria-pressed="true"] { background: var(--primary-dim); border-color: var(--primary-dim); color: #eaddff; }
  .seg small { display: block; font-size: 11.5px; opacity: .75; }
  .refpick { width: 100%; display: flex; align-items: center; gap: 10px; background: transparent; border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; color: var(--primary); cursor: pointer; text-align: left; }
  .refpick:hover, .refpick.drop { background: rgba(207,188,255,.06); }
  .refpick small { display: block; color: var(--on-soft); font-size: 12px; }
  .ref { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--card-hi); }
  .ref img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
  .ref .grow { flex: 1; font-size: 13px; color: var(--on-soft); }
  #referencelist { list-style: none; padding: 0; display: grid; gap: 8px; }
  .maskstage { position: relative; margin-top: 8px; }
  .maskstage canvas { display: block; width: 100%; height: auto; border-radius: 12px; }
  #maskcanvas { position: absolute; inset: 0; opacity: .45; touch-action: none; cursor: crosshair; }
  .masktools { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .masktools [aria-pressed="true"] { background: var(--primary-dim); color: var(--on); }
  .masktools button:disabled { opacity: .5; cursor: default; }
  #maskeditor { margin-top: 8px; }
  #maskeditor .lbl { margin-top: 8px; }
  input[type=range] { width: 100%; accent-color: var(--primary); }
  .seedrow { display: flex; gap: 8px; }
  .seed { flex: 1; background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; outline: 0; }
  .seed:focus { border-color: var(--primary); }
  details { margin-top: 18px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
  summary { cursor: pointer; color: var(--primary); display: flex; align-items: center; gap: 8px; list-style: none; font-weight: 500; }
  summary::-webkit-details-marker { display: none; }
  .btn { width: 100%; margin-top: 22px; background: var(--primary); color: var(--on-primary); border: 0; border-radius: 30px; padding: 15px; font-size: 17px; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn.small { width: auto; padding: 10px 26px; margin-top: 0; font-size: 15px; }
  .btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--line); }
  .under { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
  .hint { color: var(--on-soft); font-size: 12.5px; }

  .connect { text-align: left; max-width: 760px; width: 100%; }
  .connect h3 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .connect .first { background: var(--chip); border-radius: 14px; padding: 10px 14px; font-size: 14px; margin: 0 0 6px; }
  .connect .muted { color: var(--on-soft); margin: 0 0 14px; }
  .qr { background: #fff; width: fit-content; max-width: 100%; margin: 12px 0; padding: 14px; border-radius: 16px; }
  .qr svg { display: block; width: 260px; height: 260px; max-width: 100%; }   /* phone cameras need a big code */
  #memory { color: var(--err-on); margin: 8px 0; }
  .ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 6px 0 16px; }
  .way { background: var(--card-hi); border-radius: 20px; padding: 16px 18px; }
  .way h4 { margin: 0 0 8px; font-size: 16px; font-weight: 500; }
  .way ol { margin: 0; padding-left: 20px; color: var(--on-soft); font-size: 14px; line-height: 1.5; }
  .way li { margin-bottom: 6px; }
  .note { font-size: 13.5px; margin: 10px 0 0; color: var(--on-soft); }
  .note.live { color: var(--gold); }
  .pairf { display: grid; gap: 10px; margin-top: 10px; }
  .pairf label { display: grid; gap: 4px; font-size: 12.5px; color: var(--on-soft); }
  .pairf input { background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 15px; color: var(--on); }
  .pairf input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  .stage { background: var(--card); border-radius: 28px; min-height: 520px; display: grid; place-items: center; padding: 24px; text-align: center; }
  .stage img.out { max-width: 100%; max-height: 70vh; border-radius: 20px; display: block; margin: auto; }
  .empty .ico { width: 64px; height: 64px; color: var(--primary); }
  .empty h3 { font-size: 21px; font-weight: 500; margin: 12px 0 4px; }
  .empty p { color: var(--on-soft); margin: 0; }
  .meta { color: var(--on-soft); font-size: 13.5px; margin-top: 14px; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .err { margin-top: 14px; background: var(--err-bg); color: var(--err-on); border-radius: 16px; padding: 12px 16px; font-size: 14px; }

  /* progress screen */
  .prog { width: 100%; max-width: 560px; text-align: left; }
  .prog h3 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .prog .facts { color: var(--on-soft); font-size: 13.5px; margin: 0 0 18px; }
  .bar { height: 10px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
  .bar i { display: block; width: 100%; height: 100%; background: var(--primary); border-radius: 999px; transform-origin: left; transition: transform .4s ease; }
  .bar.indet i { width: 30%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .bar.indet i { animation: none; width: 100%; opacity: .5; } .bar i { transition: none; } }
  .times { display: flex; justify-content: space-between; color: var(--on-soft); font-size: 13px; margin: 8px 0 18px; font-variant-numeric: tabular-nums; }
  .times b { color: var(--on); font-weight: 500; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .steps li { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; font-size: 14.5px; color: var(--on-soft); }
  .steps li.now { background: var(--card-hi); color: var(--on); }
  .steps li.done { color: var(--on); }
  .steps .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; flex: none; border: 2px solid var(--line-soft); }
  .steps li.done .mark { background: var(--ok); border-color: var(--ok); color: #0b3a26; }
  .steps li.now .mark { border-color: var(--primary); border-top-color: transparent; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .steps li.now .mark { animation: none; border-top-color: var(--primary); } }
  .steps .what { flex: 1; }
  .steps .what small { display: block; color: var(--on-soft); font-size: 12.5px; }
  .steps .dur { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--on-soft); }

  h2.hist { font-size: 19px; font-weight: 500; margin: 28px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .tile { position: relative; border-radius: 16px; overflow: hidden; background: var(--card); aspect-ratio: 1; }
  .tile .open { padding: 0; border: 0; width: 100%; height: 100%; background: none; cursor: pointer; display: block; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .tile:hover img { transform: scale(1.04); }
  .tile .ov { position: absolute; inset: auto 0 0 0; display: flex; gap: 6px; padding: 8px; justify-content: center;
    background: linear-gradient(transparent, rgba(0,0,0,.75)); opacity: 0; transition: opacity .15s; }
  .tile:hover .ov, .tile:focus-within .ov { opacity: 1; }
  .tile .ov button { border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; background: var(--primary); color: var(--on-primary); }
  .tile .ov .del { background: rgba(255,255,255,.14); color: #fff; }
  .tile .ov .del.sure { background: var(--err-bg); color: var(--err-on); }
  @media (hover: none) { .tile .ov { opacity: 1; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="titles">
    <div class="brand">Local Dream <span class="spark">✨</span> · <span data-i="desktop"></span> <small data-i="unofficial"></small></div>
    <h1 data-i="title"></h1>
    <div class="sub" data-i="subtitle"></div>
    <div class="status" id="status"></div>
  </div>
  <label class="lang" title="Language"><svg><use href="#i-globe"/></svg>
    <select id="lang">
      <option value="en">English</option><option value="pt">Português</option><option value="es">Español</option>
      <option value="zh">简体中文</option><option value="ja">日本語</option>
    </select>
  </label>
  <button type="button" class="txtbtn" id="quit" hidden data-i="quit"></button>
</header>

<main>
  <form class="card" id="f" novalidate>
    <div class="lbl" style="margin-top:0"><span class="grow" data-i="device_lbl"></span><button type="button" class="tip" data-tip="tip_device" aria-label="?">?</button></div>
    <select class="model" id="device" aria-label="Device"></select>
    <div id="phoneactions" class="mdesc"></div>

    <div class="lbl"><span class="grow" data-i="model_lbl"></span><button type="button" class="txtbtn" id="modelrefresh" data-i="refresh_models"></button><button type="button" class="tip" data-tip="tip_model" aria-label="?">?</button></div>
    <select class="model" id="model" aria-label="Model"></select>
    <div class="mdesc" id="mdesc"></div>
    <div class="memrow" id="memrow" hidden><span id="memory" role="status" aria-live="polite"></span><button type="button" class="txtbtn" id="memrefresh" aria-label="Refresh">↻</button></div>

    <div class="lbl"><span class="grow"><span data-i="prompt"></span>&nbsp; <span id="tok"></span></span><button type="button" class="tip" data-tip="tip_prompt" aria-label="?">?</button></div>
    <fieldset class="field"><legend data-i="prompt_legend"></legend>
      <textarea id="prompt" required rows="3">RAW photo, portrait of a 30 year old woman, natural window light, 85mm, film grain, detailed skin</textarea>
    </fieldset>
    <p class="hint" id="referencehint" data-i="edit_hint" hidden></p>

    <div class="lbl"><span class="grow" data-i="format"></span><button type="button" class="tip" data-tip="tip_format" aria-label="?">?</button></div>
    <div class="seg" id="sizes"></div>
    <div id="customsize" class="pairf" hidden>
      <label><span data-i="width"></span><input id="width" type="number" min="512" max="2048" step="64"></label>
      <label><span data-i="height"></span><input id="height" type="number" min="512" max="2048" step="64"></label>
    </div>

    <label id="refmodewrap" class="pairf" hidden><span data-i="edit_mode"></span>
      <select id="refmode" class="model" aria-controls="singleimage referenceedit">
        <option value="image" data-i="edit_img2img"></option>
        <option value="references" data-i="edit_references"></option>
      </select>
    </label>
    <div id="referenceedit" hidden>
      <p class="hint" id="referencelimit"></p>
      <input type="file" id="referencefiles" accept="image/png,image/jpeg,image/webp" multiple hidden>
      <button type="button" id="addreferences" class="refpick" data-i="edit_add" aria-describedby="referencelimit"></button>
      <ol id="referencelist"></ol>
    </div>
    <p class="hint" id="referenceerror" role="status" aria-live="polite"></p>
    <div id="singleimage">
    <div class="lbl"><span class="grow" data-i="ref_title"></span><button type="button" class="tip" data-tip="tip_ref" aria-label="?">?</button></div>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
    <button type="button" class="refpick" id="pick"><svg><use href="#i-image"/></svg><span><span data-i="ref_pick"></span></span></button>
    <button type="button" class="txtbtn" id="pastebtn" data-i="paste_btn"></button> <span class="hint" id="pastenow" data-i="paste_now" hidden></span>
    <div class="ref" id="refbox" hidden>
      <img id="refimg" alt="">
      <div class="grow">
        <div class="lbl" style="margin:0 0 4px"><span class="grow" data-i="denoise"></span><b id="strengthv"></b><button type="button" class="tip" data-tip="tip_denoise" aria-label="?">?</button></div>
        <input type="range" id="strength" min="0" max="1" step="0.05" value="0.7">
      </div>
      <button type="button" class="txtbtn" id="clearref" data-i="remove"></button>
    </div>

    <div id="masktool" hidden>
      <button type="button" class="txtbtn" id="paintmask" data-i="mask_paint" aria-pressed="false" aria-controls="maskeditor"></button>
      <div id="maskeditor" hidden>
        <p class="hint" id="maskhint" data-i="mask_hint"></p>
        <p class="hint" id="maskempty" data-i="mask_empty" role="status" hidden></p>
        <label class="lbl" for="brushsize"><span class="grow" data-i="mask_size"></span><output id="brushsizev" for="brushsize">48 px</output></label>
        <input type="range" id="brushsize" min="1" max="256" step="1" value="48">
        <div class="masktools">
          <button type="button" class="txtbtn" id="maskbrush" data-i="mask_brush" aria-pressed="true"></button>
          <button type="button" class="txtbtn" id="maskeraser" data-i="mask_eraser" aria-pressed="false"></button>
          <button type="button" class="txtbtn" id="maskclear" data-i="mask_clear"></button>
          <button type="button" class="txtbtn" id="maskinvert" data-i="mask_invert"></button>
          <button type="button" class="txtbtn" id="maskundo" data-i="mask_undo" disabled></button>
        </div>
        <div class="maskstage">
          <canvas id="maskbase" aria-hidden="true"></canvas>
          <canvas id="maskcanvas" role="img" aria-describedby="maskhint"></canvas>
        </div>
      </div>
    </div>
    </div>

    <details id="adv">

          <form id="lanf" class="pairf">
            <label>${t("c_host")}<input id="lhost" placeholder="192.0.2.50" autocomplete="off" aria-describedby="cerr" required></label>
            ${view.connection === "wifi" ? '<p class="err" id="cerr" role="alert" hidden></p>' : ""}
            <button class="btn small">${t("c_add")}</button>
          </form></section>
        <details class="way"><summary>${t("c_advanced")}</summary><h4>${t("c_wireless")}</h4>
          <p class="note">${t("c_wireless_hint")}</p>
          <p class="note">${t("c_dev")}</p>
          <ol><li>${t("c_wifi2")}</li><li>${t("c_wifi3")}</li></ol>
          <form id="pairf" class="pairf">
            <label>${t("c_addr")}<input id="paddr" placeholder="192.0.2.50:37123" autocomplete="off" required></label>
            <label>${t("c_code")}<input id="pcode" placeholder="123456" inputmode="numeric" maxlength="6" autocomplete="off" required></label>
            <label>${t("c_connect_addr")}<input id="pconnect" placeholder="192.0.2.50:42123" autocomplete="off"></label>
            <button class="btn small">${t("c_pair")}</button>
          </form></details>
      </div>
      <p class="muted">${t("c_before")} <button type="button" class="txtbtn" id="findbtn">${t("c_find")}</button></p></div>`;
    if (view.err) { $("cerr").textContent = view.err; $("cerr").hidden = false; }
    $("lhost").value = view.host || "";
    $("lhost").oninput = () => { view.host = $("lhost").value; };
    for (const choice of ["usb", "wifi"]) $("choose" + choice).onclick = () => { view.connection = choice; renderStage(); };
    renderUsbNote();
    $("lanf").onsubmit = (ev) => { ev.preventDefault(); view.host = $("lhost").value; return runAction("/api/phones/add_lan", { host: view.host.trim() }); };
    $("pairf").onsubmit = (ev) => {
      ev.preventDefault(); const body = { address: $("paddr").value.trim(), code: $("pcode").value.trim() };
      if ($("pconnect").value.trim()) body.connect_address = $("pconnect").value.trim();
      runAction("/api/pair", body);
    };
    $("findbtn").onclick = () => runAction("/api/connect");
    if (pairing) {
      $("desktoppair").open = true;
      let wasOpen = true;
      $("desktoppair").ontoggle = () => {
        if ($("desktoppair").open === wasOpen) return;
        wasOpen = $("desktoppair").open;
        clearTimeout(pairingTimer); const next = ++pairingEpoch;
        if ($("desktoppair").open && view.kind === "connect") startPairing(next);
      };
      startPairing(epoch);
    }
  } else if (view.kind === "error") {
    const diagnosis = view.diagnosis;
    const actions = (diagnosis?.actions || []).filter((action) => !action.startsWith("retry") || lastRequest);
    const recoveryPhone = phones.phones.find((p) => p.id === (view.phone_id || lastRequest?.phone_id || sel?.phone.id));
    const evidence = (diagnosis?.evidence || []).map(diagnosisEvidence).filter(Boolean);
    if (diagnosis && ["unknown", "load_failed"].includes(diagnosis.cause) && view.msg) evidence.unshift(view.msg);
    box.innerHTML = `<div class="empty"><svg class="ico" style="color:var(--err-on)"><use href="#i-image"/></svg>
      <h3>${t("failed")}</h3><p class="err" style="max-width:440px">${esc(diagnosis ? t(`d_${diagnosis.cause}`) || t("d_unknown") : view.msg)}</p>
      ${evidence.slice(0, 3).map((line) => `<p class="muted">${esc(line)}</p>`).join("")}
      <div class="actions" style="flex-wrap:wrap;justify-content:center">${actions.filter((action) => action !== "reopen_host_mode" || recoveryPhone?.has_adb).map((action) => `<button type="button" class="btn small ghost" data-diagnosis="${esc(action)}">${esc(t(`a_${action}`))}</button>`).join("")}</div>
      ${actions.includes("reopen_host_mode") && !recoveryPhone?.has_adb ? `<p class="muted">${esc(t("c_host_path"))}</p>` : ""}
      ${view.hint ? `<p class="muted" role="status" style="white-space:pre-line">${esc(view.hint)}</p>` : ""}</div>`;
    box.querySelectorAll("[data-diagnosis]").forEach((button) => button.onclick = () => diagnosisAction(button.dataset.diagnosis));
  } else if (view.kind === "progress") {
    renderProgress(box);
  } else {
    const it = view.item, m = it.meta;
    box.innerHTML = `<div><img class="out" src="${esc(it.url)}" alt="">
      <div class="meta">${esc(m.width)}×${esc(m.height)} · ${esc(m.model || "")} · ${t("seed_lbl")} ${esc(m.seed)} · ${esc(t("seconds", ((m.phone_ms || 0) / 1000).toFixed(1)))}${m.phone ? ` · ${esc(m.phone)}` : ""}</div>
      <div class="actions"><a class="btn small" href="${esc(it.url)}" download>${t("download")}</a>
      <button type="button" class="btn small ghost" id="reuse">${t("reuse")}</button></div></div>`;
    $("reuse").onclick = () => reuse(m);
  }
}

function renderUsbNote() {
  const note = $("usbnote"); if (!note) return;
  const unauthorized = phones.usb_waiting?.length || phones.usb_waiting === true;
  const markup = phones.adb_available === false
    ? `${esc(t("c_no_adb"))} <a href="https://developer.android.com/tools/releases/platform-tools" target="_blank" rel="noopener noreferrer">${esc(t("c_tools"))}</a>`
    : esc(t(unauthorized ? "c_allow" : "c_usb_auto"));
  if (note._markup !== markup) { note.innerHTML = markup; note._markup = markup; }
  note.classList.toggle("live", !!unauthorized);
}

/* progress: what is happening, how far, how long */
function renderProgress(box) {
  const now = Date.now() / 1000 + clock, j = job;
  const stages = j?.stages || [], cur = stages.length ? stages[stages.length - 1][0] : "connect";
  const seen = stages.map((s) => s[0]), future = waitingFor === "generating" ? ["generate", "save"] : waitingFor === "stopping" ? ["stop"] : [];
  const order = [...seen, ...future.filter((s) => !seen.includes(s))];
  const p = j?.progress, times = j?.step_times || [];
  const rate = times.length > 1 ? (times[times.length - 1] - times[0]) / (times.length - 1) : null;
  let frac = null, left = null;
  if (cur === "generate" && p) { frac = 0.08 + 0.88 * p[0] / p[1]; left = rate ? rate * (p[1] - p[0]) + 1 : null; }
  else if (cur === "save") frac = 0.98;
  const elapsed = j ? now - j.started : 0;
  if (left == null && j?.estimate_s && cur !== "save") left = Math.max(0, j.estimate_s + (cur === "generate" ? 0 : 3) - (cur === "generate" ? now - stages[stages.length - 1][1] : 0));
  const facts = j?.facts ? j.facts : "";
  const rows = order.map((name) => {
    const s = stages.find((x) => x[0] === name), state = !s ? "todo" : (s[2] || name !== cur) ? "done" : "now";
    const dur = s ? fmtS((s[2] || now) - s[1]) : "";
    let sub = name === "load" ? t("st_load_d") : "";
    if (name === "generate" && p && state !== "todo") sub = t("step_n", p[0], p[1], rate ? rate.toFixed(1) : null);
    return `<li class="${state}"><span class="mark">${state === "done" ? "✓" : ""}</span>
      <span class="what">${esc(t("st_" + name))}${sub ? `<small>${esc(sub)}</small>` : ""}</span><span class="dur">${esc(dur)}</span></li>`;
  }).join("");
  box.innerHTML = `<div class="prog" role="status" aria-live="polite">
    <h3>${t(waitingFor === "connecting" ? "prog_connect" : waitingFor === "stopping" ? "st_stop" : "prog_title")}</h3>
    <p class="facts">${esc(facts)}</p>
    <div class="bar ${frac == null ? "indet" : ""}"><i style="transform:scaleX(${frac == null ? 1 : frac.toFixed(3)})"></i></div>
    <div class="times"><span><b>${fmtS(elapsed)}</b> ${t("elapsed")}</span><span>${left != null ? t("left", fmtS(left)) : ""}</span></div>
    <ol class="steps">${rows}</ol></div>`;
}

function reuse(m) {
  const phone = catalog.find((p) => p.id === m.phone_id && available(p));
  const model = phone?.models?.find((x) => x.id === m.model_id);
  if (model) { sel = { phone, model }; modelChanged(); }
  if (m.prompt != null) $("prompt").value = m.prompt;
  if (m.negative_prompt != null || m.neg != null) $("neg").value = m.negative_prompt ?? m.neg;
  const size = capabilities().sizes?.kind === "fixed" ? `${capabilities().sizes.size}x${capabilities().sizes.size}` : `${m.width}x${m.height}`;
  opts = { ...opts, size, aspect_ratio: m.aspect_ratio ?? "1:1", scheduler: m.scheduler ?? opts.scheduler,
           steps: m.steps ?? opts.steps, cfg: m.cfg ?? opts.cfg, strength: m.denoise_strength ?? m.strength ?? opts.strength, seed: String(m.seed ?? "") };
  renderDevices(); renderModels();
  renderSizes(); sync(); save(); $("prompt").focus();
}

let waitingFor = null, factsLine = "";
$("f").onsubmit = async (ev) => {
  ev.preventDefault();
  if (waiting || requestPending) return;
  if (!sel?.model) { view = { kind: "error", msg: t("no_models") }; renderStage(); return; }
  if (!available(sel.phone)) { view = { kind: "error", msg: t(phoneState(sel.phone)) }; renderStage(); return; }
  if (!$("prompt").value.trim()) { view = { kind: "error", msg: t("empty_prompt") }; renderStage(); return; }
  if (!validSize()) { view = { kind: "error", msg: t("bad_size") }; renderStage(); $("width").focus(); return; }
  const editing = editMode === "references" && capabilities().reference_edit === true;
  if (editing && (referenceLoading || references.length < 1 || references.length > capabilities().max_references)) {
    $("referenceerror").textContent = t("edit_count", capabilities().max_references); return;
  }
  if (!editing && refData && !capabilities().img2img) { view = { kind: "error", msg: t("img2img_disabled") }; renderStage(); return; }
  const [width, height] = opts.size.split("x").map(Number);
  const body = { prompt: $("prompt").value, neg: $("neg").value, seed: opts.seed === "" ? null : Number(opts.seed), steps: opts.steps, cfg: opts.cfg,
                 scheduler: opts.scheduler, width, height, aspect_ratio: opts.aspect_ratio,
                 phone_id: sel.phone.id, model_id: sel.model.id };
  if (capabilities().sizes.kind !== "fixed") delete body.aspect_ratio;
  if (editing) body.reference_images = references.map((ref) => ref.data);
  else if (refData) Object.assign(body, { image: refData, reference_name: refName, strength: opts.strength });
  const mask = exportMask();
  if (mask !== null) Object.assign(body, { mask, image: $("maskbase").toDataURL("image/png").split(",", 2)[1] });
  await submitGeneration(body);
};

async function submitGeneration(body) {
  if (waiting || requestPending || backendLost || quitting || stopped) return;
  lastRequest = { ...body };
  requestPending = true; actionSerial++; renderDevices();
  try {
    await post("/api/generate", body);
    const phone = catalog.find((p) => p.id === body.phone_id) || sel?.phone;
    const model = phone?.models?.find((m) => m.id === body.model_id) || sel?.model;
    factsLine = [model?.name || body.model_id, `${body.width}×${body.height}`, `${body.steps} ${t("steps").toLowerCase()}`, phone?.name].filter(Boolean).join(" · ");
    waiting = true; waitingFor = "generating"; job = null;
    view = { kind: "progress" }; renderStage();
  } catch (e) { view = { kind: "error", msg: e.message }; renderStage(); }
  finally { requestPending = false; renderDevices(); schedulePoll(0); }
}

async function poll() {
  if (document.hidden || requestPending || polling) return;
  polling = true;
  try { await pollStatus(); } finally { polling = false; }
}
async function pollStatus() {
  if (stopped) return;
  const serial = actionSerial;
  let s;
  try { const r = await fetch("/api/status"); if (!r.ok) throw new Error(); s = await r.json(); }
  catch {
    if (quitting) { finishQuit(); return; }
    backendLost = true; renderStatus(); renderStage(); renderDevices(); return;
  }
  if (serial !== actionSerial) return;
  const recovered = backendLost;
  backendLost = false;
  $("quit").hidden = !(s.capabilities?.quit === true || s.quit === true) || quitting;
  clock = s.now - Date.now() / 1000;
  if (sel?.model && s.job?.phone_id === sel.phone.id && s.job?.model_id === sel.model.id) {
    const key = `${sel.phone.id}/${sel.model.id}`;
    memoryData = { ...(memoryKey === key ? memoryData : {}), app_state: s.job.app_state };
    memoryKey = key;
    renderMemory();
  }
  const pairingBefore = offerPairing();
  const was = JSON.stringify(phones.phones.map((p) => [p.id, p.state, p.transport]));
  phones = s.phones || phones;
  if (view.kind === "connect" && pairingBefore !== offerPairing()) renderStage();
  if (JSON.stringify(phones.phones.map((p) => [p.id, p.state, p.transport])) !== was
      || phones.phones.some((p) => p.state === "ready" && !catalog.find((c) => c.id === p.id)?.models?.length)) {
    await loadModels();
  }
  if (serial !== actionSerial) return;
  renderStatus();
  if (waiting) {
    if (s.busy) { job = s.job ? { ...s.job, facts: factsLine } : job; waitingFor = s.busy === "connecting" ? "connecting" : waitingFor; if (view.kind !== "quit_busy") view = { kind: "progress" }; renderStage(); }
    else {
      const failedPhone = job?.phone_id;
      waiting = false; $("go").disabled = false; job = null;
      const msg = s.error && errorMessage(s.error);
      if (s.error && connectionView) view = { ...connectionView, err: msg };
      else if (s.error && s.diagnosis) view = { kind: "error", msg, diagnosis: s.diagnosis, phone_id: failedPhone || lastRequest?.phone_id };
      else if (s.error && !anyPhone()) view = { kind: "connect", err: msg };
      else if (s.error) view = { kind: "error", msg };
      else if (waitingFor !== "generating") { view = { kind: "empty" }; await loadModels(); }
      else if (s.last) { view = { kind: "image", item: s.last }; loadGallery(); }
      else view = { kind: "empty" };
      connectionView = null; waitingFor = null; renderStage();
    }
  } else if (s.busy) {                // started by the background (USB cable)
    waiting = true; waitingFor = s.busy; job = s.job; factsLine = "";
    view = { kind: "progress" }; renderStage();
  } else if (!anyPhone() && view.kind === "empty") { view = { kind: "connect" }; renderStage(); }
  else if (anyPhone() && view.kind === "connect" && !view.err && !view.manual) { /* keep it open only when asked for */ }
  renderUsbNote();
  renderDevices();
  if (recovered) renderStage();
}

function renderStatus() {
  const markup = stopped ? `<span role="status">${esc(t("stopped"))}</span>` : backendLost ? `<span class="pill" role="status">${esc(t("backend_lost"))}</span>`
    : `${anyPhone() ? "" : `<button class="pill off" id="phonebtn">${esc(t("phone_off"))}</button>`}
      <button class="txtbtn" id="addphone">+ ${esc(t("add_phone"))}</button>${quitting ? `<span role="status">${esc(t("quit_wait"))}</span>` : ""}`;
  if ($("status")._markup === markup) return;
  $("status").innerHTML = markup; $("status")._markup = markup;
  for (const id of ["phonebtn", "addphone"]) if ($(id)) $(id).onclick = () => { view = { kind: "connect" }; renderStage(); };
}

let backendLost = false, quitting = false, stopped = false, quitView = null, quitRequest = false;
function finishQuit() {
  stopped = true; backendLost = false; waiting = false; job = null;
  clearTimeout(pollTimer); clearTimeout(pairingTimer); ++pairingEpoch;
  $("quit").hidden = true;
  renderStatus(); renderDevices(); renderStage();
}
async function quitDesktop(afterJob = false) {
  if (quitRequest || stopped || quitting) return;
  quitRequest = true;
  try {
    const r = await fetch("/api/quit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(afterJob ? { after_job: true } : {}) });
    const data = await r.json();
    if (!r.ok) {
      if (r.status === 409 && (data.error === "job_running" || data.error === "busy")) { quitView = view; view = { kind: "quit_busy" }; renderStage(); return; }
      throw new Error(errorMessage({ code: data.error, detail: data.detail }));
    }
    if (afterJob) {
      quitting = true; $("quit").hidden = true; view = quitView || { kind: "empty" };
      renderStatus(); renderDevices(); renderStage(); schedulePoll(0);
    } else finishQuit();
  } catch (e) { view = { kind: "error", msg: e.message || t("offline") }; renderStage(); }
  finally { quitRequest = false; }
}
$("quit").onclick = () => quitDesktop();

async function loadGallery() {
  try { const r = await fetch("/api/gallery"); if (!r.ok) return; history = await r.json(); } catch { return; }
  $("grid").innerHTML = "";
  $("histempty").hidden = history.length > 0;
  for (const it of history) {
    const b = document.createElement("div");
    b.className = "tile"; b.title = it.meta.prompt || "";
    b.innerHTML = `<button type="button" class="open" aria-label="${esc(t("open_image") + (it.meta.prompt ? ' · ' + it.meta.prompt : ' · ' + (it.meta.model || it.url)))}"><img loading="lazy" src="${esc(it.url)}" alt=""></button>
      <div class="ov"><button type="button" class="imp">${t("imp")}</button><button type="button" class="del">${t("del")}</button></div>`;
    b.querySelector(".open").onclick = () => { view = { kind: "image", item: it }; renderStage(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    b.querySelector(".imp").onclick = () => { reuse(it.meta); window.scrollTo({ top: 0, behavior: "smooth" }); };
    const del = b.querySelector(".del");
    del.onclick = async () => {
      if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = t("del_sure"); return; }
      const r = await fetch("/api/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: it.url }) });
      if (r.ok) { if (view.item?.url === it.url) { view = { kind: "empty" }; renderStage(); } loadGallery(); }
    };
    b.onmouseleave = () => { del.classList.remove("sure"); del.textContent = t("del"); };
    $("grid").appendChild(b);
  }
  renderEstimate();
}

let polling = false, pollTimer = null, actionSerial = 0;
function schedulePoll(delay = waiting ? 1000 : 4000) {
  clearTimeout(pollTimer);
  if (document.hidden || stopped) return;
  pollTimer = setTimeout(async () => { try { await poll(); } finally { schedulePoll(); } }, delay);
}
document.addEventListener("visibilitychange", () => {
  clearTimeout(pollTimer); if (!document.hidden) schedulePoll(0);
  if (!document.hidden && view.kind === "connect") renderStage();
});
sync(); applyLang(); loadModels(); loadGallery(); schedulePoll(0);
setInterval(() => { if (!document.hidden && !backendLost && !stopped && view.kind === "progress") renderStage(); }, 1000);   // keep the clocks moving between polls
</script>
</body>
</html>
